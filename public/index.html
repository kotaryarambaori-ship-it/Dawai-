
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dawai aur Doctor</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#f1f5f9;
 font-family:Arial,sans-serif;color:#172033
}
header{
 background:linear-gradient(135deg,#0f766e,#2563eb);
 color:white;text-align:center;padding:30px 12px
}
main{max-width:700px;margin:20px auto;padding:12px}
.card{
 background:white;padding:18px;
 border-radius:15px;margin-bottom:18px;
 box-shadow:0 4px 15px #0001
}
h2{margin-top:0}
input,select,textarea{
 width:100%;padding:12px;margin:6px 0 12px;
 border:1px solid #cbd5e1;border-radius:9px;
 font-size:16px
}
button{
 width:100%;padding:13px;border:0;
 border-radius:9px;background:#0f766e;
 color:white;font-size:17px;font-weight:bold
}
button:disabled{opacity:.6}
#message{margin:12px 0;font-weight:bold}
.result{
 border:1px solid #ddd;padding:13px;
 border-radius:10px;margin:10px 0
}
.result h3{margin:0 0 8px}
a{color:#0f766e;font-weight:bold}
</style>
</head>
<body>

<header>
<h1>💊 Dawai aur Doctor</h1>
<p>अपने गाँव में डॉक्टर और मेडिकल खोजें</p>
</header>

<main>
<section class="card">
<h2>🔎 डॉक्टर या मेडिकल खोजें</h2>

<form id="searchForm">

<label>गाँव</label>
<input id="village" required placeholder="गाँव का नाम">

<label>तहसील</label>
<input id="tehsil" required placeholder="तहसील">

<label>जिला</label>
<input id="district" required placeholder="जिला">

<label>क्या खोजें?</label>
<select id="type">
<option value="all">सभी</option>
<option value="doctor">डॉक्टर</option>
<option value="medical">मेडिकल स्टोर</option>
</select>

<button id="findBtn" type="submit">Dhoondo</button>
</form>

<div id="message" role="status"></div>
<div id="results"></div>
</section>

<section class="card">
<h2>➕ Admin: नई जानकारी जोड़ें</h2>

<form id="adminForm">

<label>Admin Key</label>
<input id="adminKey" type="password" required>

<label>नाम</label>
<input id="name" required>

<label>प्रकार</label>
<select id="newType">
<option value="doctor">डॉक्टर</option>
<option value="medical">मेडिकल स्टोर</option>
</select>

<label>गाँव</label>
<input id="newVillage" required>

<label>तहसील</label>
<input id="newTehsil" required>

<label>जिला</label>
<input id="newDistrict" required>

<label>पता</label>
<textarea id="address"></textarea>

<label>फोन नंबर</label>
<input id="phone">

<label>खुलने का समय</label>
<input id="openTime" type="time">

<label>बंद होने का समय</label>
<input id="closeTime" type="time">

<button id="addBtn">जानकारी सेव करें</button>
</form>

<div id="adminMessage"></div>
</section>
</main>

<script>
const $ = id => document.getElementById(id);

function message(id,text,error=false){
 const el=$(id);
 el.textContent=text;
 el.style.color=error?"#b91c1c":"#166534";
}

$("searchForm").addEventListener("submit",async e=>{
 e.preventDefault();

 const button=$("findBtn");
 const results=$("results");
 results.replaceChildren();
 message("message","खोज रहे हैं...");

 button.disabled=true;

 try{
  const params=new URLSearchParams({
   village:$("village").value.trim(),
   tehsil:$("tehsil").value.trim(),
   district:$("district").value.trim(),
   type:$("type").value
  });

  const response=await fetch("/api/search?"+params);
  const data=await response.json();

  if(!response.ok) throw new Error(data.message);

  message("message",data.message);

  data.results.forEach(place=>{
   const box=document.createElement("div");
   box.className="result";

   const title=document.createElement("h3");
   title.textContent=place.name;

   const info=document.createElement("p");
   info.textContent=
    (place.type==="doctor"?"डॉक्टर":"मेडिकल स्टोर")+
    " | "+place.village+", "+place.tehsil+
    ", "+place.district;

   const address=document.createElement("p");
   address.textContent=place.address||"पता उपलब्ध नहीं";

   const phone=document.createElement("p");
   phone.textContent=place.phone
    ?"फोन: "+place.phone:"फोन नंबर उपलब्ध नहीं";

   box.append(title,info,address,phone);

   if(place.phone){
    const call=document.createElement("a");
    call.href="tel:"+place.phone;
    call.textContent="📞 कॉल करें";
    box.append(call);
   }

   results.append(box);
  });

 }catch(err){
  message("message",
   "खोज में समस्या: "+(err.message||"Server error"),true);
 }finally{
  button.disabled=false;
 }
});

$("adminForm").addEventListener("submit",async e=>{
 e.preventDefault();

 const button=$("addBtn");
 button.disabled=true;

 try{
  const payload={
   name:$("name").value.trim(),
   type:$("newType").value,
   village:$("newVillage").value.trim(),
   tehsil:$("newTehsil").value.trim(),
   district:$("newDistrict").value.trim(),
   address:$("address").value.trim(),
   phone:$("phone").value.trim(),
   openTime:$("openTime").value||null,
   closeTime:$("closeTime").value||null
  };

  const response=await fetch("/api/places",{
   method:"POST",
   headers:{
    "Content-Type":"application/json",
    "x-admin-key":$("adminKey").value
   },
   body:JSON.stringify(payload)
  });

  const data=await response.json();
  if(!response.ok) throw new Error(data.message);

  message("adminMessage",data.message);
  $("adminForm").reset();

 }catch(err){
  message("adminMessage",
   "सेव नहीं हुआ: "+err.message,true);
 }finally{
  button.disabled=false;
 }
});
</script>
</body>
</html>
