
<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#087f8c">
  <title>दवाई और डॉक्टर खोजें</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#f1f5f9;color:#172033;font-family:Arial,sans-serif}
    header{background:linear-gradient(135deg,#087f8c,#2563eb);color:white;padding:25px 16px;text-align:center}
    header h1{margin:0 0 8px;font-size:25px}
    header p{margin:0;font-size:14px}
    main{max-width:720px;margin:18px auto;padding:0 12px 35px}
    .card{background:white;border-radius:15px;padding:17px;margin-bottom:16px;box-shadow:0 3px 14px #0000000c}
    h2{font-size:19px;margin:0 0 15px}
    label{display:block;font-weight:600;font-size:14px;margin:12px 0 6px}
    input,select{width:100%;padding:13px;border:1px solid #cbd5e1;border-radius:9px;font-size:16px;background:white}
    button{border:0;border-radius:9px;padding:13px 17px;font-size:16px;font-weight:bold;cursor:pointer}
    .primary{background:#087f8c;color:white;width:100%;margin-top:16px}
    .adminbtn{background:#1e293b;color:white;width:100%}
    .result{border:1px solid #e2e8f0;border-radius:13px;padding:15px;margin-top:12px;background:#fff}
    .result h3{margin:0 0 8px;font-size:18px}
    .tag{display:inline-block;background:#e0f2fe;color:#075985;padding:5px 9px;border-radius:20px;font-size:12px;margin-bottom:9px}
    .detail{font-size:14px;color:#475569;margin:7px 0;line-height:1.5;overflow-wrap:anywhere}
    .call{display:inline-block;background:#16a34a;color:white;text-decoration:none;padding:10px 15px;border-radius:8px;margin-top:8px;font-weight:bold}
    .message{padding:12px;border-radius:9px;margin-top:12px;font-size:14px;display:none}
    .success{display:block;background:#dcfce7;color:#166534}
    .error{display:block;background:#fee2e2;color:#991b1b}
    .info{display:block;background:#e0f2fe;color:#075985}
    .empty{text-align:center;color:#64748b;padding:20px 8px}
    .hidden{display:none}
    .muted{color:#64748b;font-size:13px}
    footer{text-align:center;color:#64748b;font-size:12px;padding:15px}
  </style>
</head>
<body>

<header>
  <h1>🩺 दवाई और डॉक्टर खोजें</h1>
  <p>अपने गाँव में डॉक्टर और मेडिकल स्टोर की जानकारी पाएँ</p>
</header>

<main>

  <!-- SEARCH SECTION -->
  <section class="card">
    <h2>🔎 डॉक्टर / मेडिकल स्टोर ढूंढें</h2>

    <form id="searchForm">
      <label for="village">गाँव का नाम</label>
      <input id="village" placeholder="गाँव का नाम लिखें" required>

      <label for="tehsil">तहसील का नाम</label>
      <input id="tehsil" placeholder="तहसील का नाम लिखें" required>

      <label for="district">जिले का नाम</label>
      <input id="district" placeholder="जिले का नाम लिखें" required>

      <label for="type">क्या ढूंढना है?</label>
      <select id="type">
        <option value="all">सभी — डॉक्टर और मेडिकल स्टोर</option>
        <option value="doctor">केवल डॉक्टर</option>
        <option value="medical">केवल मेडिकल स्टोर</option>
      </select>

      <button class="primary" id="searchBtn" type="submit">🔍 ढूंढो</button>
    </form>

    <div id="searchMessage" class="message"></div>
  </section>

  <!-- RESULTS: ONLY SEARCH BUTTON SHOWS RESULTS -->
  <section id="resultsSection" class="card hidden">
    <h2 id="resultHeading">खोज के परिणाम</h2>
    <div id="resultsList"></div>
  </section>

  <!-- ADMIN SECTION -->
  <section class="card">
    <h2>🔐 एडमिन पैनल — जानकारी जोड़ें</h2>
    <p class="muted">डॉक्टर या मेडिकल स्टोर की जानकारी यहाँ सेव करें।</p>

    <form id="adminForm">
      <label for="adminKey">Admin Key</label>
      <input id="adminKey" type="password" placeholder="अपनी Admin Key डालें" required>

      <label for="name">डॉक्टर / दुकान का नाम</label>
      <input id="name" placeholder="नाम लिखें" required>

      <label for="adminType">प्रकार</label>
      <select id="adminType" required>
        <option value="doctor">डॉक्टर</option>
        <option value="medical">मेडिकल स्टोर</option>
      </select>

      <label for="adminVillage">गाँव</label>
      <input id="adminVillage" placeholder="गाँव का नाम" required>

      <label for="adminTehsil">तहसील</label>
      <input id="adminTehsil" placeholder="तहसील का नाम" required>

      <label for="adminDistrict">जिला</label>
      <input id="adminDistrict" placeholder="जिले का नाम" required>

      <label for="address">पूरा पता</label>
      <input id="address" placeholder="दुकान या क्लिनिक का पता">

      <label for="phone">मोबाइल नंबर</label>
      <input id="phone" type="tel" placeholder="मोबाइल नंबर">

      <label for="openTime">खुलने का समय</label>
      <input id="openTime" placeholder="जैसे सुबह 9 बजे">

      <label for="closeTime">बंद होने का समय</label>
      <input id="closeTime" placeholder="जैसे शाम 6 बजे">

      <label for="openDays">किस दिन खुलता है?</label>
      <input id="openDays" placeholder="जैसे Monday to Sunday">

      <button class="primary" id="saveBtn" type="submit">💾 जानकारी सेव करें</button>
    </form>

    <div id="saveMessage" class="message"></div>
  </section>

</main>

<footer>दवाई और डॉक्टर खोजें | आपकी सुविधा के लिए</footer>

<script>
const $ = id => document.getElementById(id);

function showMessage(element, message, type) {
  element.textContent = message;
  element.className = "message " + type;
}

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, char => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#039;"
  })[char]);
}

function safePhone(value) {
  return String(value || "").replace(/[^\d+]/g, "");
}

// SEARCH: RESULTS ARE SHOWN ONLY AFTER PRESSING SEARCH
$("searchForm").addEventListener("submit", async function(event) {
  event.preventDefault();

  const button = $("searchBtn");
  const message = $("searchMessage");
  const section = $("resultsSection");
  const list = $("resultsList");

  button.disabled = true;
  button.textContent = "खोज रहे हैं...";
  section.classList.remove("hidden");
  list.innerHTML = "";
  showMessage(message, "जानकारी खोजी जा रही है...", "info");

  const params = new URLSearchParams({
    village: $("village").value.trim(),
    tehsil: $("tehsil").value.trim(),
    district: $("district").value.trim(),
    type: $("type").value
  });

  try {
    const response = await fetch("/api/search?" + params.toString());
    const data = await response.json();

    if (!response.ok || data.ok === false) {
      throw new Error(data.error || "खोज नहीं हो सकी");
    }

    const results = Array.isArray(data.results) ? data.results : [];

    if (results.length === 0) {
      $("resultHeading").textContent = "कोई रिकॉर्ड नहीं मिला";
      list.innerHTML = `
        <div class="empty">
          <div style="font-size:35px">🔍</div>
          <p>इस गाँव में अभी कोई डॉक्टर या मेडिकल स्टोर नहीं मिला।</p>
          <p class="muted">नाम और गाँव, तहसील तथा जिले की स्पेलिंग जाँचें।</p>
        </div>`;
      showMessage(message, "खोज पूरी हुई। कोई रिकॉर्ड नहीं मिला।", "info");
      return;
    }

    $("resultHeading").textContent = "खोज के परिणाम — " + results.length + " मिले";

    list.innerHTML = results.map(place => {
      const isDoctor = place.type === "doctor";
      const phone = safePhone(place.phone);
      const kind = isDoctor ? "डॉक्टर" : "मेडिकल स्टोर";

      return `
        <article class="result">
          <span class="tag">${isDoctor ? "🩺 डॉक्टर" : "💊 मेडिकल स्टोर"}</span>
          <h3>${escapeHTML(place.name)}</h3>
          <p class="detail">📍 ${escapeHTML(place.village)}, ${escapeHTML(place.tehsil)}, ${escapeHTML(place.district)}</p>
          ${place.address ? `<p class="detail">🏠 पता: ${escapeHTML(place.address)}</p>` : ""}
          ${place.phone ? `<p class="detail">📞 मोबाइल: ${escapeHTML(place.phone)}</p>` : ""}
          ${(place.open_time || place.close_time) ?
            `<p class="detail">🕒 समय: ${escapeHTML(place.open_time || "")}${place.open_time && place.close_time ? " से " : ""}${escapeHTML(place.close_time || "")}</p>` : ""}
          ${place.open_days ? `<p class="detail">📅 दिन: ${escapeHTML(place.open_days)}</p>` : ""}
          ${phone ? `<a class="call" href="tel:${escapeHTML(phone)}">📞 कॉल करें</a>` : ""}
        </article>`;
    }).join("");

    showMessage(message, "खोज पूरी हुई। " + results.length + " रिकॉर्ड मिले।", "success");

  } catch (error) {
    list.innerHTML = "";
    $("resultHeading").textContent = "खोज में समस्या";
    showMessage(message, error.message || "सर्वर से संपर्क नहीं हो सका।", "error");
  } finally {
    button.disabled = false;
    button.textContent = "🔍 ढूंढो";
  }
});

// SAVE: ONLY SHOW SUCCESS MESSAGE. DO NOT SHOW RESULT CARDS.
$("adminForm").addEventListener("submit", async function(event) {
  event.preventDefault();

  const button = $("saveBtn");
  const message = $("saveMessage");

  button.disabled = true;
  button.textContent = "सेव हो रहा है...";
  showMessage(message, "जानकारी सेव की जा रही है...", "info");

  const payload = {
    name: $("name").value.trim(),
    type: $("adminType").value,
    village: $("adminVillage").value.trim(),
    tehsil: $("adminTehsil").value.trim(),
    district: $("adminDistrict").value.trim(),
    address: $("address").value.trim(),
    phone: $("phone").value.trim(),
    openTime: $("openTime").value.trim(),
    closeTime: $("closeTime").value.trim(),
    openDays: $("openDays").value.trim()
  };

  try {
    const response = await fetch("/api/places", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "x-admin-key": $("adminKey").value
      },
      body: JSON.stringify(payload)
    });

    const data = await response.json();

    if (!response.ok || data.ok === false) {
      throw new Error(data.error || data.message || "जानकारी सेव नहीं हो सकी");
    }

    // Success message only. No search and no result card here.
    showMessage(message, "✅ जानकारी सफलतापूर्वक सेव हो गई!", "success");

    const savedKey = $("adminKey").value;
    $("adminForm").reset();
    $("adminKey").value = savedKey;

  } catch (error) {
    showMessage(message, "सेव नहीं हुआ: " + error.message, "error");
  } finally {
    button.disabled = false;
    button.textContent = "💾 जानकारी सेव करें";
  }
});
</script>

</body>
                                         </html>
