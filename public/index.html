<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dawai aur Doctor</title>
<style>
:root{--g:#0b6e8a;--bg:#eef6f8;--ink:#14262c;--line:#cfe0e5;--ok:#1d6b34;--red:#b3261e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:var(--g);color:#fff;text-align:center;padding:26px 16px}
header h1{margin:0;font-size:2rem}header p{margin:6px 0 0}
main{max-width:520px;margin:0 auto;padding:16px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:16px}
h2{margin:0 0 6px;font-size:1.3rem}
label{display:block;margin:12px 0 5px}
input,select{width:100%;padding:13px;border:1px solid var(--line);border-radius:10px;font:inherit;background:#fff}
input:focus,select:focus,button:focus-visible,a:focus-visible{outline:3px solid var(--g);outline-offset:1px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chk{display:flex;align-items:center;gap:10px;margin-top:14px}.chk input{width:auto}
button{width:100%;margin-top:14px;padding:14px;border:0;border-radius:10px;background:var(--g);color:#fff;font:inherit;font-weight:700;cursor:pointer}
button:disabled{opacity:.6}
.msg{display:none;margin-bottom:16px;padding:14px;border-radius:10px;background:#e3eaed}
.msg.show{display:block}.msg.err{background:#fde7e5;color:var(--red)}.msg.ok{background:#dff3e4;color:var(--ok)}
.pl{border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:12px}
.pl b{font-size:1.1rem}.pl p{margin:4px 0 0;color:#42585f}
.tag{display:inline-block;padding:3px 10px;border-radius:99px;font-size:.85rem;font-weight:700;margin-left:6px}
.tag.on{background:#dff3e4;color:var(--ok)}.tag.off{background:#fde7e5;color:var(--red)}
.call{display:inline-block;margin-top:10px;color:var(--g);font-weight:700}
.note{font-size:.9rem;color:#42585f;margin-top:12px}
details summary{cursor:pointer;font-weight:700}
</style>
</head>
<body>
<header><h1>💊 Dawai aur Doctor</h1><p>Aapke gaon mein kaun khula hai</p></header>
<main>
  <div class="msg" id="msg" role="status"></div>

  <section class="card">
    <h2>🔎 Dhoondo</h2>
    <label for="village">Village (Gaon)</label>
    <input id="village" placeholder="Jaise: Lalapur">
    <div class="row">
      <div><label for="tehsil">Tehsil</label><input id="tehsil"></div>
      <div><label for="district">District (Zila)</label><input id="district"></div>
    </div>
    <label for="kind">Kya chahiye?</label>
    <select id="kind">
      <option value="">Dawai dukan aur doctor dono</option>
      <option value="dawai">Sirf dawai dukan</option>
      <option value="doctor">Sirf doctor</option>
    </select>
    <label class="chk"><input type="checkbox" id="open"> Sirf abhi khule hue</label>
    <button id="searchBtn">🔍 Dhoondo</button>
    <div id="results"></div>
    <p class="note">⚠️ Samay dukan ya doctor ke maalik ne diya hai, badal bhi sakta hai. Jaane se pehle phone kar lo. Emergency mein <b>108</b> ya <b>112</b> par call karo. Dawai doctor ki salah se hi lo.</p>
  </section>

  <section class="card">
    <details>
      <summary>➕ Dukan ya doctor jodo (admin)</summary>
      <label for="akey">Admin key</label><input id="akey" type="password" autocomplete="off">
      <label for="akind">Prakar</label>
      <select id="akind"><option value="dawai">Dawai dukan</option><option value="doctor">Doctor</option></select>
      <label for="aname">Naam *</label><input id="aname">
      <label for="avillage">Village (Gaon) *</label><input id="avillage">
      <div class="row">
        <div><label for="atehsil">Tehsil</label><input id="atehsil"></div>
        <div><label for="adistrict">District (Zila)</label><input id="adistrict"></div>
      </div>
      <label for="aphone">Phone</label><input id="aphone" type="tel" inputmode="tel">
      <div class="row">
        <div><label for="aopen">Khulta hai</label><input id="aopen" type="time" value="09:00"></div>
        <div><label for="aclose">Band hota hai</label><input id="aclose" type="time" value="21:00"></div>
      </div>
      <label for="aday">Hafte mein band din</label>
      <select id="aday">
        <option value="">Koi nahi</option><option value="Sun">Ravivar</option><option value="Mon">Somvar</option>
        <option value="Tue">Mangalvar</option><option value="Wed">Budhvar</option><option value="Thu">Guruvar</option>
        <option value="Fri">Shukravar</option><option value="Sat">Shanivar</option>
      </select>
      <label for="anote">Note</label><input id="anote" maxlength="120" placeholder="Jaise: General physician">
      <button id="addBtn">Save karo</button>
    </details>
  </section>
</main>
<script>
const $ = id => document.getElementById(id);
const esc = s => { const d = document.createElement("div"); d.textContent = s == null ? "" : String(s); return d.innerHTML; };
function show(t, c) { const m = $("msg"); m.textContent = t; m.className = "msg show " + (c || ""); m.scrollIntoView({ behavior: "smooth", block: "nearest" }); }
const DAY = { Sun: "Ravivar", Mon: "Somvar", Tue: "Mangalvar", Wed: "Budhvar", Thu: "Guruvar", Fri: "Shukravar", Sat: "Shanivar" };

$("searchBtn").addEventListener("click", async () => {
  const p = new URLSearchParams({ village: $("village").value.trim(), tehsil: $("tehsil").value.trim(), district: $("district").value.trim(), kind: $("kind").value });
  if ($("open").checked) p.set("open", "1");
  const btn = $("searchBtn");
  btn.disabled = true; btn.textContent = "Dhoond rahe hain...";
  $("results").innerHTML = "";
  try {
    const res = await fetch("/api/search?" + p);
    const d = await res.json();
    if (!res.ok) return show(d.error || "Kuch gadbad hui.", "err");
    show(d.message, d.found ? "ok" : "err");
    $("results").innerHTML = d.places.map(x => `
      <div class="pl">
        <b>${x.kind === "doctor" ? "🩺" : "💊"} ${esc(x.name)}</b>
        ${x.openNow === true ? '<span class="tag on">Abhi khula</span>' : x.openNow === false ? '<span class="tag off">Abhi band</span>' : ""}
        <p>${[x.village, x.tehsil, x.district].filter(Boolean).map(esc).join(", ")}${x.open ? " | " + esc(x.open) + " se " + esc(x.close) : ""}${x.closedDay ? " | " + DAY[x.closedDay] + " band" : ""}</p>
        ${x.note ? `<p>${esc(x.note)}</p>` : ""}
        ${x.phone ? `<a class="call" href="tel:${esc(x.phone)}">📞 ${esc(x.phone)}</a>` : ""}
      </div>`).join("") + (d.places.some(x => x.source === "osm") ? '<p class="note">Kuch data © OpenStreetMap contributors se hai.</p>' : "");
  } catch { show("Server se connect nahi hua. Ek minute ruk kar dobara try karo.", "err"); }
  finally { btn.disabled = false; btn.textContent = "🔍 Dhoondo"; }
});

$("addBtn").addEventListener("click", async () => {
  const body = { kind: $("akind").value, name: $("aname").value, village: $("avillage").value, tehsil: $("atehsil").value, district: $("adistrict").value, phone: $("aphone").value,
    open: $("aopen").value, close: $("aclose").value, closedDay: $("aday").value, note: $("anote").value };
  try {
    const res = await fetch("/api/places", { method: "POST", headers: { "Content-Type": "application/json", "x-admin-key": $("akey").value }, body: JSON.stringify(body) });
    const d = await res.json();
    show(res.ok ? d.message : d.error, res.ok ? "ok" : "err");
    if (res.ok) ["aname", "avillage", "atehsil", "adistrict", "aphone", "anote"].forEach(i => $(i).value = "");
  } catch { show("Server se connect nahi hua.", "err"); }
});
</script>
</body>
</html>
