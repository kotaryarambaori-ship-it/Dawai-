
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f766e">
<title>Dawai aur Doctor</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;background:#f1f5f9;
 font-family:Arial,sans-serif;color:#172033
}
header{
 background:linear-gradient(135deg,#0f766e,#2563eb);
 color:white;text-align:center;padding:28px 12px
}
main{max-width:700px;margin:20px auto;padding:12px}
.card{
 background:white;padding:18px;
 border-radius:15px;margin-bottom:18px;
 box-shadow:0 4px 15px #0001
}
h2{margin-top:0;color:#0f766e}
label{display:block;font-weight:bold;margin-top:5px}
input,select,textarea{
 width:100%;padding:12px;margin:6px 0 12px;
 border:1px solid #cbd5e1;border-radius:9px;
 font-size:16px;background:white
}
button{
 width:100%;padding:13px;border:0;
 border-radius:9px;background:#0f766e;
 color:white;font-size:17px;font-weight:bold;
 cursor:pointer
}
button:disabled{opacity:.6}
#message,#adminMessage{
 margin:12px 0;font-weight:bold;line-height:1.5
}
.result{
 border:1px solid #ddd;padding:14px;
 border-radius:10px;margin:10px 0;
 background:#fff
}
.result h3{margin:0 0 8px;color:#0f766e}
.result p{margin:7px 0;line-height:1.5}
a{color:#0f766e;font-weight:bold}
.small{font-size:13px;color:#64748b}
footer{text-align:center;color:#64748b;padding:15px}
</style>
</head>

<body>
<header>
<h1>💊 Dawai aur Doctor</h1>
<p>अपने गाँव में डॉक्टर और मेडिकल स्टोर खोजें</p>
</header>

<main>

<section class="card">
<h2>🔎 डॉक्टर या मेडिकल खोजें</h2>

<form id="searchForm">
<label>गाँव</label>
<input id="village" required placeholder="गाँव का नाम">

<label>तहसील</label>
<input id="tehsil" required placeholder="तहसील">

<label>जिला</label>
<input id="district" required placeholder="जिला">

<label>क्या खोजें?</label>
<select id="type">
<option value="all">सभी</option>
<option value="doctor">डॉक्टर</option>
<option value="medical">मेडिकल स्टोर</option>
</select>

<button id="findBtn" type="submit">🔎 ढूँढें</button>
</form>

<div id="message" role="status" aria-live="polite"></div>
<div id="results"></div>
</section>

<section class="card">
<h2>➕ Admin: नई जानकारी जोड़ें</h2>
<p class="small">डॉक्टर या मेडिकल स्टोर की जानकारी जोड़ने के लिए Admin Key जरूरी है।</p>

<form id="adminForm">

<label>Admin Key</label>
<input id="adminKey" type="password" required autocomplete="current-password">

<label>नाम</label>
<input id="name" required placeholder="डॉक्टर या मेडिकल स्टोर का नाम">

<label>प्रकार</label>
<select id="newType">
<option value="doctor">डॉक्टर</option>
<option value="medical">मेडिकल स्टोर</option>
</select>

<label>गाँव</label>
<input id="newVillage" required>

<label>तहसील</label>
<input id="newTehsil" required>

<label>जिला</label>
<input id="newDistrict" required>

<label>पता</label>
<textarea id="address" placeholder="पूरा पता"></textarea>

<label>फोन नंबर</label>
<input id="phone" type="tel" placeholder="मोबाइल नंबर">

<label>खुलने का समय</label>
<input id="openTime" type="time">

<label>बंद होने का समय</label>
<input id="closeTime" type="time">

<label>खुलने के दिन</label>
<input id="openDays" placeholder="जैसे: सोमवार से शनिवार">

<button id="addBtn" type="submit">जानकारी सेव करें</button>
</form>

<div id="adminMessage" role="status" aria-live="polite"></div>
</section>

<section class="card">
<h2>📊 Database स्थिति</h2>
<button id="healthBtn" type="button">Database जाँचें</button>
<div id="healthMessage" class="small"></div>
</section>

</main>

<footer>
Dawai aur Doctor
</footer>

<script>
const $ = id => document.getElementById(id);

function showMessage(id, text, error=false) {
  const el = $(id);
  el.textContent = text;
  el.style.color = error ? "#b91c1c" : "#166534";
}

async function readResponse(response) {
  const data = await response.json().catch(() => ({}));

  if (!response.ok) {
    throw new Error(data.error || data.message || "Server error");
  }

  return data;
}

// SEARCH
$("searchForm").addEventListener("submit", async e => {
  e.preventDefault();

  const button = $("findBtn");
  const results = $("results");

  results.replaceChildren();
  showMessage("message", "खोज रहे हैं...");
  button.disabled = true;

  try {
    const params = new URLSearchParams({
      village: $("village").value.trim(),
      tehsil: $("tehsil").value.trim(),
      district: $("district").value.trim(),
      type: $("type").value
    });

    const response = await fetch("/api/search?" + params.toString());
    const data = await readResponse(response);

    if (!Array.isArray(data.results)) {
      throw new Error("Server से सही परिणाम नहीं मिले");
    }

    if (data.results.length === 0) {
      showMessage(
        "message",
        "कोई रिकॉर्ड नहीं मिला। पहले नीचे Admin फॉर्म से डॉक्टर या मेडिकल स्टोर की जानकारी सेव करें।"
      );
      return;
    }

    showMessage("message", `कुल ${data.results.length} परिणाम मिले।`);

    data.results.forEach(place => {
      const box = document.createElement("div");
      box.className = "result";

      const title = document.createElement("h3");
      title.textContent = place.name;

      const info = document.createElement("p");
      info.textContent =
        (place.type === "doctor" ? "डॉक्टर" : "मेडिकल स्टोर") +
        " | " + place.village + ", " +
        place.tehsil + ", " + place.district;

      const address = document.createElement("p");
      address.textContent = "पता: " + (place.address || "उपलब्ध नहीं");

      const phone = document.createElement("p");
      phone.textContent = "फोन: " + (place.phone || "उपलब्ध नहीं");

      box.append(title, info, address, phone);

      if (place.open_time || place.close_time) {
        const timing = document.createElement("p");
        timing.textContent =
          "समय: " + (place.open_time || "—") +
          " से " + (place.close_time || "—");
        box.append(timing);
      }

      if (place.open_days) {
        const days = document.createElement("p");
        days.textContent = "खुलने के दिन: " + place.open_days;
        box.append(days);
      }

      if (place.phone) {
        const call = document.createElement("a");
        call.href = "tel:" + place.phone;
        call.textContent = "📞 कॉल करें";
        box.append(call);
      }

      results.append(box);
    });

  } catch (err) {
    showMessage("message", "खोज में समस्या: " + err.message, true);
  } finally {
    button.disabled = false;
  }
});

// ADD NEW PLACE
$("adminForm").addEventListener("submit", async e => {
  e.preventDefault();

  const button = $("addBtn");
  button.disabled = true;

  try {
    const payload = {
      name: $("name").value.trim(),
      type: $("newType").value,
      village: $("newVillage").value.trim(),
      tehsil: $("newTehsil").value.trim(),
      district: $("newDistrict").value.trim(),
      address: $("address").value.trim(),
      phone: $("phone").value.trim(),
      openTime: $("openTime").value || null,
      closeTime: $("closeTime").value || null,
      openDays: $("openDays").value.trim()
    };

    const response = await fetch("/api/places", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "x-admin-key": $("adminKey").value
      },
      body: JSON.stringify(payload)
    });

    const data = await readResponse(response);

    showMessage(
      "adminMessage",
      data.message || "जानकारी सफलतापूर्वक सेव हो गई।"
    );

    const savedKey = $("adminKey").value;
    $("adminForm").reset();
    $("adminKey").value = savedKey;

  } catch (err) {
    showMessage("adminMessage", "सेव नहीं हुआ: " + err.message, true);
  } finally {
    button.disabled = false;
  }
});

// DATABASE STATUS
$("healthBtn").addEventListener("click", async () => {
  const button = $("healthBtn");
  button.disabled = true;

  showMessage("healthMessage", "जाँच हो रही है...");

  try {
    const response = await fetch("/api/health");
    const data = await readResponse(response);

    showMessage(
      "healthMessage",
      "Database Connected | कुल रिकॉर्ड: " + data.totalPlaces
    );

  } catch (err) {
    showMessage("healthMessage", err.message, true);
  } finally {
    button.disabled = false;
  }
});
</script>

</body>
 </html>
