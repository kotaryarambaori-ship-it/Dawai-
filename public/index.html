
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#075985">
<title>Doctor & Medical Store Finder</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f1f5f9;color:#172033;font-family:Arial,sans-serif}
header{background:linear-gradient(135deg,#075985,#2563eb);color:white;padding:25px 16px;text-align:center}
header h1{margin:0 0 8px;font-size:24px}
header p{margin:0;font-size:14px}
main{max-width:760px;margin:auto;padding:14px}
.card{background:white;border-radius:15px;padding:17px;margin:13px 0;box-shadow:0 3px 12px #0000000c}
h2{font-size:19px;margin:0 0 14px}
h3{font-size:17px;margin:0 0 8px}
label{display:block;font-size:14px;font-weight:bold;margin:12px 0 6px}
input,select{width:100%;padding:13px;border:1px solid #cbd5e1;border-radius:9px;font-size:16px;background:white}
button{width:100%;padding:13px;border:0;border-radius:9px;background:#0369a1;color:white;font-size:16px;font-weight:bold;margin-top:15px;cursor:pointer}
button:disabled{opacity:.6}
.secondary{background:#475569}
.result{border:1px solid #e2e8f0;border-radius:12px;padding:14px;margin:12px 0}
.result p{font-size:14px;line-height:1.6;margin:7px 0}
.result a{color:#0369a1;overflow-wrap:anywhere}
.tag{display:inline-block;background:#e0f2fe;color:#075985;padding:5px 9px;border-radius:20px;font-size:12px;margin-bottom:8px}
.status{font-size:14px;color:#475569;line-height:1.6}
.hidden{display:none}
footer{text-align:center;color:#64748b;font-size:12px;padding:20px}
</style>
</head>
<body>

<header>
<h1>डॉक्टर एवं मेडिकल स्टोर खोजें</h1>
<p>अपने गाँव में डॉक्टर और दवा की दुकान खोजें</p>
</header>

<main>

<section class="card">
<h2>🔎 ऑनलाइन खोज</h2>

<label for="village">गाँव का नाम</label>
<input id="village" placeholder="जैसे Lalapur" required>

<label for="tehsil">तहसील</label>
<input id="tehsil" placeholder="जैसे Bara" required>

<label for="district">जिला</label>
<input id="district" placeholder="जैसे Prayagraj" required>

<label for="type">क्या खोजना है?</label>
<select id="type">
<option value="all">डॉक्टर और मेडिकल स्टोर दोनों</option>
<option value="doctor">केवल डॉक्टर</option>
<option value="medical">केवल मेडिकल स्टोर</option>
</select>

<button id="searchBtn" onclick="searchPlaces()">ढूंढो</button>
<p class="status" id="searchStatus"></p>
</section>

<section id="databaseSection" class="card hidden">
<h2>📋 हमारे डेटाबेस के परिणाम</h2>
<div id="databaseResults"></div>
</section>

<section id="onlineSection" class="card hidden">
<h2>🌐 इंटरनेट से मिले परिणाम</h2>
<div id="onlineResults"></div>
</section>

<section class="card">
<h2>🔐 Admin: जानकारी सेव करें</h2>

<label>Admin Key</label>
<input id="adminKey" type="password" placeholder="अपनी Admin Key डालें">

<label>डॉक्टर / मेडिकल स्टोर का नाम</label>
<input id="placeName" placeholder="नाम">

<label>प्रकार</label>
<select id="placeType">
<option value="doctor">डॉक्टर</option>
<option value="medical">मेडिकल स्टोर</option>
</select>

<label>गाँव</label>
<input id="saveVillage" placeholder="गाँव">

<label>तहसील</label>
<input id="saveTehsil" placeholder="तहसील">

<label>जिला</label>
<input id="saveDistrict" placeholder="जिला">

<label>पता</label>
<input id="address" placeholder="पूरा पता">

<label>मोबाइल नंबर</label>
<input id="phone" type="tel" placeholder="मोबाइल नंबर">

<label>खुलने का समय</label>
<input id="openTime" placeholder="जैसे सुबह 9 बजे">

<label>बंद होने का समय</label>
<input id="closeTime" placeholder="जैसे रात 9 बजे">

<label>खुलने के दिन</label>
<input id="openDays" placeholder="जैसे Monday to Saturday">

<button onclick="savePlace()">जानकारी सेव करें</button>
<p class="status" id="saveStatus"></p>
</section>

</main>

<footer>
यहाँ दिखाई गई इंटरनेट जानकारी को मूल स्रोत पर जाकर सत्यापित करें।
</footer>

<script>
const $ = id => document.getElementById(id);

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, char => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#039;"
  })[char]);
}

function validUrl(value) {
  try {
    const url = new URL(value);
    return ["http:", "https:"].includes(url.protocol) ? url.href : "";
  } catch {
    return "";
  }
}

function dbCard(item) {
  const phone = String(item.phone || "").replace(/[^\d+]/g, "");
  return `
    <div class="result">
      <span class="tag">${item.type === "doctor" ? "डॉक्टर" : "मेडिकल स्टोर"}</span>
      <h3>${escapeHTML(item.name)}</h3>
      <p>📍 ${escapeHTML(item.address || item.village || "")}</p>
      <p>🏘️ ${escapeHTML(item.village)}, ${escapeHTML(item.tehsil)}, ${escapeHTML(item.district)}</p>
      ${phone ? `<p>📞 <a href="tel:${escapeHTML(phone)}">${escapeHTML(item.phone)}</a></p>` : ""}
      <p>समय: ${escapeHTML(item.open_time || "")} - ${escapeHTML(item.close_time || "")}</p>
      <p>दिन: ${escapeHTML(item.open_days || "")}</p>
      <small>हमारे डेटाबेस में सेव जानकारी</small>
    </div>`;
}

function webCard(item, category) {
  const url = validUrl(item.url);
  if (!url) return "";

  return `
    <div class="result">
      <span class="tag">${category === "doctors" ? "डॉक्टर से संबंधित वेब परिणाम" : "मेडिकल से संबंधित वेब परिणाम"}</span>
      <h3>${escapeHTML(item.title)}</h3>
      <p>${escapeHTML(item.snippet || "अधिक जानकारी के लिए मूल स्रोत खोलें।")}</p>
      <p><a href="${escapeHTML(url)}" target="_blank" rel="noopener noreferrer">मूल वेबसाइट खोलें ↗</a></p>
      <small>वेब सर्च परिणाम; स्थानीय पता स्वतंत्र रूप से सत्यापित करें।</small>
    </div>`;
}

async function searchPlaces() {
  const village = $("village").value.trim();
  const tehsil = $("tehsil").value.trim();
  const district = $("district").value.trim();
  const type = $("type").value;

  if (!village || !tehsil || !district) {
    $("searchStatus").textContent = "गाँव, तहसील और जिला भरें।";
    return;
  }

  const btn = $("searchBtn");
  btn.disabled = true;
  btn.textContent = "खोज रहे हैं...";
  $("searchStatus").textContent =
    `खोज रहे हैं: ${village}, ${tehsil}, ${district}, Uttar Pradesh, India`;

  $("databaseSection").classList.remove("hidden");
  $("onlineSection").classList.remove("hidden");
  $("databaseResults").innerHTML = "डेटाबेस खोज रहे हैं...";
  $("onlineResults").innerHTML = "इंटरनेट पर खोज रहे हैं...";

  const params = new URLSearchParams({village, tehsil, district, type});

  try {
    const [dbResponse, webResponse] = await Promise.all([
      fetch("/api/search?" + params),
      fetch("/api/online-search?" + params)
    ]);

    const dbData = await dbResponse.json();
    const webData = await webResponse.json();

    if (dbData.ok) {
      $("databaseResults").innerHTML = dbData.results.length
        ? dbData.results.map(dbCard).join("")
        : "<p>इस गाँव के डेटाबेस में कोई रिकॉर्ड नहीं मिला।</p>";
    } else {
      $("databaseResults").textContent = dbData.error || "डेटाबेस खोज विफल।";
    }

    if (webData.ok) {
      const doctors = (webData.doctors || [])
        .map(item => webCard(item, "doctors")).join("");

      const medical = (webData.medical || [])
        .map(item => webCard(item, "medical")).join("");

      $("onlineResults").innerHTML =
        (doctors ? "<h3>डॉक्टर</h3>" + doctors : "") +
        (medical ? "<h3>मेडिकल स्टोर</h3>" + medical : "") +
        (!doctors && !medical
          ? "<p>इस गाँव के लिए पर्याप्त लोकेशन जानकारी वाला ऑनलाइन परिणाम नहीं मिला।</p>"
          : "") +
        (webData.warning
          ? `<p class="status">${escapeHTML(webData.warning)}</p>`
          : "");
    } else {
      $("onlineResults").textContent =
        webData.error || "ऑनलाइन खोज नहीं हो सकी।";
    }

    $("searchStatus").textContent =
      `खोज पूरी हुई: ${village}, ${tehsil}, ${district}`;
  } catch (error) {
    $("searchStatus").textContent =
      "सर्वर से संपर्क नहीं हो सका। दोबारा कोशिश करें।";
    $("databaseResults").textContent = "कनेक्शन त्रुटि।";
    $("onlineResults").textContent = "कनेक्शन त्रुटि।";
  } finally {
    btn.disabled = false;
    btn.textContent = "ढूंढो";
  }
}

async function savePlace() {
  const key = $("adminKey").value.trim();

  if (!key) {
    $("saveStatus").textContent = "Admin Key डालें।";
    return;
  }

  const data = {
    name: $("placeName").value.trim(),
    type: $("placeType").value,
    village: $("saveVillage").value.trim(),
    tehsil: $("saveTehsil").value.trim(),
    district: $("saveDistrict").value.trim(),
    address: $("address").value.trim(),
    phone: $("phone").value.trim(),
    openTime: $("openTime").value.trim(),
    closeTime: $("closeTime").value.trim(),
    openDays: $("openDays").value.trim()
  };

  $("saveStatus").textContent = "सेव हो रहा है...";

  try {
    const response = await fetch("/api/places", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "x-admin-key": key
      },
      body: JSON.stringify(data)
    });

    const result = await response.json();

    $("saveStatus").textContent = result.ok
      ? "जानकारी सफलतापूर्वक सेव हो गई।"
      : (result.error || "जानकारी सेव नहीं हुई।");

    if (result.ok) {
      $("placeName").value = "";
      $("address").value = "";
      $("phone").value = "";
      $("openTime").value = "";
      $("closeTime").value = "";
      $("openDays").value = "";
    }
  } catch {
    $("saveStatus").textContent = "सर्वर से संपर्क नहीं हो सका।";
  }
}
</script>
</body>
</html>
